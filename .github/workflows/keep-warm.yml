# Render's free plan puts the site to sleep after ~15 minutes with no visitors,
# so the next visitor waits while it wakes up. This pings the health check every
# 10 minutes during the day (Eastern time) so the site is ready when someone opens it.
name: Keep site awake

on:
  schedule:
    - cron: "*/10 11-23,0-3 * * *" # every 10 minutes, about 7 AM to 11 PM Eastern
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the site
        run: curl -fsS --max-time 60 https://my-terminal-28tq.onrender.com/api/health || true
