services:
  - type: web
    name: my-terminal
    runtime: node
    plan: free
    buildCommand: "echo no build step"
    startCommand: "node server.js"
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      # Optional two-server setup (README → "Two-server setup"): set MODE=public and DESK_TOKEN here.
      - key: MODE
        sync: false
      - key: DESK_TOKEN
        sync: false
      - key: NODE_VERSION
        value: "22"
